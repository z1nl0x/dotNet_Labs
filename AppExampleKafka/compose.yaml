name: apptest-banking
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: apptest_bancario
      POSTGRES_USER: apptest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-somente-dev-troque-esta-senha}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15437}:5432"
    volumes:
      - banco_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apptest -d apptest_bancario"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka-storage-init:
    image: apache/kafka:4.1.1
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec", "chown -R 1000:1000 /kafka-data"]
    volumes:
      - kafka_data:/kafka-data
  kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 15
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic banco.transacoes.v1 --partitions 3 --replication-factor 1 --config min.insync.replicas=1
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8082}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: apptest-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
  api:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=apptest_bancario;Username=apptest;Password=${POSTGRES_PASSWORD:-somente-dev-troque-esta-senha}
      Jwt__SecretKey: ${JWT_SECRET:-apenas-dev-chave-longa-substitua-em-producao-123456789}
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: banco.transacoes.v1
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
volumes:
  banco_data:
  kafka_data:
